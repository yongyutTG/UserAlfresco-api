<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alfresco User Files</title>
  <link rel="stylesheet" href="/frontend/documents.css">
</head>
<body>
  <header class="topbar">
    <div class="nav-inner">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <h1>Alfresco User Files</h1>
          <div class="subhead" id="currentPath">Login ด้วย user Alfresco เพื่อดู folder/file ตามสิทธิ์ของ user</div>
        </div>
      </div>
      <div class="nav-actions hidden" id="sessionBar">
        <a class="nav-link" href="/">API Docs</a>
        <div class="user-pill">
          <span class="user-dot" aria-hidden="true"></span>
          <span>ผู้ใช้งาน: <strong id="sessionUser">-</strong></span>
        </div>
        <button id="logoutBtn" class="secondary" type="button">Logout</button>
      </div>
    </div>
  </header>

  <main>
    <div class="workspace">
      <aside class="sidebar">
        <section class="panel" id="filePanel">
          <h2 class="panel-title">ค้นหาเอกสาร</h2>
          <div class="toolbar" aria-label="ค้นหาไฟล์">
            <div>
              <label>โฟลเดอร์ที่เห็นตามสิทธิ์</label>
              <div class="folder-count" id="folderCount">กำลังตรวจสอบสิทธิ์...</div>
              <div class="folder-list" id="folderList">
                <div class="empty">กำลังโหลดโฟลเดอร์...</div>
              </div>
            </div>
            <div>
              <label for="keyword">ค้นหาชื่อไฟล์</label>
              <input id="keyword" type="search" placeholder="เช่น 026277, 38849, .pdf" autocomplete="off">
            </div>
            <div>
              <label for="pageSize">จำนวนต่อหน้า</label>
              <select id="pageSize">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="250">250</option>
                <option value="500">500</option>
              </select>
            </div>
            <div class="button-row">
              <button id="searchBtn" type="button">ค้นหา</button>
              <button id="clearBtn" class="secondary" type="button">ล้าง</button>
            </div>
          </div>
        </section>
      </aside>

      <section>
        <div class="status">
          <div id="summary">กรุณา login ก่อนใช้งาน</div>
          <div id="pageInfo"></div>
        </div>

        <section class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 56px;">#</th>
                <th>ชื่อไฟล์</th>
                <th style="width: 110px;">ขนาด</th>
                <th style="width: 170px;">วันที่สร้าง</th>
                <th style="width: 120px;">เปิดไฟล์</th>
              </tr>
            </thead>
            <tbody id="fileRows">
              <tr><td colspan="5" class="empty">ยังไม่มีข้อมูล</td></tr>
            </tbody>
          </table>
        </section>

        <nav class="pager" aria-label="แบ่งหน้า">
          <button id="prevBtn" class="secondary" type="button">ก่อนหน้า</button>
          <button id="nextBtn" type="button">ถัดไป</button>
        </nav>
      </section>
    </div>
  </main>
  <script src="/frontend/documents.js"></script>
</body>
</html>
